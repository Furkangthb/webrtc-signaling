<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <title>WebRTC Görüşme</title>

    <style>
        #localVideo,
        #remoteVideo {
            width: 640px;
            height: 480px;
            object-fit: cover;
        }
    </style>
</head>

<body>

    <p id="statusMessage"></p>
    <h2>Benim Görüntüm</h2>
    <video id="localVideo" autoplay playsinline muted></video>

    <div>
        <button id="toggleVideoBtn">Kamera Aç</button>
        <button id="toggleMicBtn">Mikrofonu Aç</button>
    </div>
    <div>
        <button id="toggleScreenBtn">Ekran Paylaş</button>
    </div>
    <div>
        <button id="toggleRecordBtn">Kaydı Başlat</button>
    </div>
    <div>
        <label for="qualityControl">Video Kalitesi</label>
        <select name="" id="qualityControl">
            <option value="480">480p</option>
            <option value="720">720p</option>
            <option value="1080">1080p(HD)</option>
        </select>
    </div>
    <div>
        <label for="remoteVolume">Karşı Taraf Ses Seviyesi</label>
        <input type="range" id="remoteVolume" min="0" max="2" step="0.05" value="1">
    </div>

    <div>
        <label for="localVolume">Ses Seviyesi</label>
        <input type="range" id="localVolume" min="0" max="2" step="0.05" value="1">
    </div>

   <div>
    <h2>Mesajlaşma</h2>
    <div id="chatMessages" style="border:1px solid #ccc; height:200px; width:400px; overflow-y:auto; padding:8px;"></div>
    <p id="typingIndicator" style="font-style:italic; color:#888; height:18px; margin:2px 0; font-size:13px;"></p>
    <input type="text" id="chatInput" placeholder="Mesaj yaz..." style="width:230px;">
    <input type="file" id="chatFileInput" style="display:none;">
    <button id="attachFileBtn" title="Dosya ekle">📎</button>
    <button id="sendChatBtn">Gönder</button>
</div>


    <h2>Karşı Tarafın Görüntüsü</h2>
    <video id="remoteVideo" autoplay playsinline></video>

    <script src="main.js"></script>
</body>

</html>
